name: MORE12 Telegram Opening Scanner

on:
  schedule:
    # 09:35 IST, Monday-Friday. GitHub may start scheduled jobs a few minutes late.
    - cron: '35 9 * * 1-5'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: more12-telegram-opening-scan
  cancel-in-progress: false

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run today's opening-candle scanner and send Telegram report
        run: python more12_telegram.py
