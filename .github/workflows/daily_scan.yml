name: NSE 09:46 Live Scanner

on:
  schedule:
    # 04:16 UTC = 09:46 IST
    # Monday-Friday
    - cron: "16 4 * * 1-5"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  live-market-scan:

    runs-on: ubuntu-latest

    # Allow enough time for:
    # - environment setup
    # - NSE universe download
    # - NIFTY download
    # - Yahoo Finance stock batches
    # - calculations
    # - Telegram delivery
    timeout-minutes: 20

    env:
      TZ: Asia/Kolkata

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ==========================================================
      # INSTALL
      # ==========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================================
      # ENVIRONMENT DIAGNOSTICS
      # ==========================================================

      - name: Verify environment
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "UTC time:"
          date -u

          echo ""
          echo "IST time:"
          TZ=Asia/Kolkata date

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Telegram bot token configured:"
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            echo "YES"
          else
            echo "NO"
            exit 1
          fi

          echo ""
          echo "Telegram chat ID configured:"
          if [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "YES"
          else
            echo "NO"
            exit 1
          fi

      # ==========================================================
      # RUN SCANNER
      # ==========================================================

      - name: Run single 09:46 IST live scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets."8984037851:AAGnc5Tm088pqdilp8kL-I5giUXylP8hRQQ"}}
          TELEGRAM_CHAT_ID: ${{ secrets."1860594381"}}

          MIN_TURNOVER_CR: "2.0"
          TOP_SHORTS_TO_SHOW: "5"
          TOP_LONGS_TO_SHOW: "3"

          LOG_LEVEL: "INFO"

        run: |
          python runner.py
